<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CashProof AI{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}CashProof AI — Bank Statement Cash Flow Analysis{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4f8;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-light: rgba(37,99,235,0.12);
            --success: #16a34a;
            --success-light: rgba(22,163,74,0.10);
            --danger: #dc2626;
            --danger-light: rgba(220,38,38,0.10);
            --warning: #d97706;
            --warning-light: rgba(217,119,6,0.12);
            --amber: #f59e0b;
            --amber-light: rgba(245,158,11,0.12);
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Navigation ── */
        nav.topnav {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .brand-logo {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 0.85rem;
            box-shadow: 0 0 12px var(--primary-light);
        }
        .brand-text { font-weight: 700; font-size: 1.05rem; color: var(--text); letter-spacing: -0.02em; }
        .brand-badge {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--primary);
            background: var(--primary-light); padding: 0.15rem 0.45rem;
            border-radius: 20px; border: 1px solid rgba(37,99,235,0.2);
        }
        .nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .nav-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.4rem 0.85rem; border-radius: var(--radius-sm);
            font-size: 0.875rem; font-weight: 500; color: var(--text-muted);
            text-decoration: none; transition: var(--transition);
        }
        .nav-link:hover { background: var(--bg); color: var(--text); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

        /* ── Layout ── */
        .page-wrapper { max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-header { margin-bottom: 1.75rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
        .page-subtitle { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        /* ── Stat cards ── */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .stat-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 0.35rem; }
        .stat-value { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; }
        .stat-card.green .stat-value { color: var(--success); }
        .stat-card.blue  .stat-value { color: var(--primary); }
        .stat-card.amber .stat-value { color: var(--amber); }
        .stat-card.red   .stat-value { color: var(--danger); }
        .stat-card::after {
            content: ''; position: absolute; inset: 0;
            opacity: 0; transition: var(--transition);
        }
        .stat-card.green::after { background: var(--success-light); }
        .stat-card.blue::after  { background: var(--primary-light); }
        .stat-card.amber::after { background: var(--amber-light); }

        /* ── Badges ── */
        .badge {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.6rem;
            border-radius: 20px; white-space: nowrap;
        }
        .badge-success { background: var(--success-light); color: var(--success); }
        .badge-primary { background: var(--primary-light); color: var(--primary); }
        .badge-warning { background: var(--warning-light); color: var(--warning); }
        .badge-danger  { background: var(--danger-light);  color: var(--danger); }
        .badge-amber   { background: var(--amber-light);   color: var(--amber); }
        .badge-muted   { background: #f1f5f9; color: var(--text-muted); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 600;
            font-size: 0.875rem; cursor: pointer; transition: var(--transition);
            border: 1.5px solid transparent; font-family: inherit; text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: #fff; border-color: var(--primary);
            box-shadow: 0 2px 10px rgba(37,99,235,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.35); }
        .btn-secondary { background: #fff; color: var(--text); border-color: var(--border); }
        .btn-secondary:hover { background: var(--bg); }
        .btn-success { background: linear-gradient(135deg, var(--success) 0%, #15803d 100%); color: #fff; border-color: var(--success); }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,163,74,0.3); }
        .btn-danger { background: var(--danger-light); color: var(--danger); border-color: rgba(220,38,38,0.25); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; border-radius: 8px; }

        /* ── Tables ── */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table.data-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        table.data-table th {
            background: #f8fafc; font-weight: 600; font-size: 0.72rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--text-muted); padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
        }
        table.data-table td {
            padding: 0.7rem 1rem; border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table.data-table tr:last-child td { border-bottom: none; }
        table.data-table tr:hover td { background: var(--bg); }
        table.data-table .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
        table.data-table .mono { font-family: ui-monospace, 'Courier New', monospace; font-size: 0.82rem; }
        .row-ib-confirmed td { background: rgba(245,158,11,0.07); }
        .row-ib-possible  td { background: rgba(220,38,38,0.05); }

        /* ── Alerts ── */
        .alert {
            padding: 0.85rem 1.1rem; border-radius: 10px; font-size: 0.875rem;
            font-weight: 500; margin-bottom: 0.75rem;
            display: flex; justify-content: space-between; align-items: center;
            animation: fadeSlide 0.3s ease;
        }
        .alert-success { background: var(--success-light); border: 1px solid rgba(22,163,74,0.2); color: #15803d; }
        .alert-error, .alert-danger { background: var(--danger-light); border: 1px solid rgba(220,38,38,0.2); color: #b91c1c; }
        .alert-info    { background: var(--primary-light); border: 1px solid rgba(37,99,235,0.2); color: #1d4ed8; }
        .alert-warning { background: var(--warning-light); border: 1px solid rgba(217,119,6,0.2); color: #92400e; }
        .alert-close { background: none; border: none; color: currentColor; cursor: pointer; font-size: 1.1rem; opacity: 0.6; }
        .alert-close:hover { opacity: 1; }

        @keyframes fadeSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Form controls ── */
        .form-group { margin-bottom: 1.1rem; }
        .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
        .form-control {
            width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
            padding: 0.65rem 0.9rem; font-size: 0.9rem; font-family: inherit;
            color: var(--text); background: #fff; outline: none; transition: var(--transition);
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .form-control::placeholder { color: #94a3b8; }

        /* ── Processing spinner ── */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Section divider ── */
        .section { margin-bottom: 1.75rem; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .section-title { font-size: 0.95rem; font-weight: 700; }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
        .empty-state-text { font-size: 0.9rem; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav class="topnav">
        <a href="{% url 'cashproof_ai:session_list' %}" class="brand">
            <div class="brand-logo">CP</div>
            <span class="brand-text">CashProof</span>
            <span class="brand-badge">AI</span>
        </a>
        <div class="nav-links">
            <a href="{% url 'cashproof_ai:session_list' %}" class="nav-link {% block nav_sessions %}{% endblock %}">Sessions</a>
            <a href="{% url 'cashproof_ai:new_session' %}" class="nav-link {% block nav_new %}{% endblock %}">+ New Analysis</a>
            <a href="{% url 'bank_accounts' %}" class="nav-link">My Accounts</a>
            <a href="{% url 'logout' %}" class="nav-link">Sign Out</a>
        </div>
    </nav>

    <div class="page-wrapper">
        {% if messages %}
        <div style="margin-bottom: 1rem;">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                <span>{{ message }}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
